name: Release skills

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate release version
        run: python scripts/validate.py --root . --tag "$RELEASE_TAG"
      - name: Test repository tooling
        run: python -m unittest discover -s tests -v
      - name: Check original Python behavior
        run: |
          python -m unittest discover -s evals/code-simplifier/fixtures/python-simple -v
          python -m unittest discover -s evals/code-simplifier/fixtures/python-dynamic -v
      - name: Check original async behavior
        run: node --test evals/code-simplifier/fixtures/javascript-module/service.test.mjs
      - name: Build verified release artifacts
        run: python scripts/package.py --root . --output dist --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip
          --verify-tag --title "Agent Skills $RELEASE_TAG"
          --notes-file dist/release-notes.md
