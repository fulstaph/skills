name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository
        run: python scripts/validate.py --root .
      - name: Test repository tooling
        run: python -m unittest discover -s tests -v
      - name: Check original Python behavior
        run: |
          python -m unittest discover -s evals/code-simplifier/fixtures/python-simple -v
          python -m unittest discover -s evals/code-simplifier/fixtures/python-dynamic -v
      - name: Check original async behavior
        run: node --test evals/code-simplifier/fixtures/javascript-module/service.test.mjs
